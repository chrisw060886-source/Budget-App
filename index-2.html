<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>No Bullshit Budgeting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Inter', sans-serif; background:#F3EFFB; margin:0; }
  .font-display { font-family: 'Baloo 2', sans-serif; }
</style>
</head>
<body>
<div id="root"><div style="padding:20px;color:#7A6E86;font-family:sans-serif;">Loading…</div></div>
<script>
  function showErr(msg) {
    var el = document.getElementById('root');
    el.innerHTML = '<pre style="padding:16px;color:#B33A2C;background:#FFE4E0;white-space:pre-wrap;font-size:13px;">' + msg.toString().replace(/</g,'&lt;') + '</pre>';
  }
  window.addEventListener('error', function (e) { showErr('Error: ' + e.message + ' (line ' + e.lineno + ')'); });
  window.addEventListener('unhandledrejection', function (e) { showErr('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ---- fill these in with your own project details ----
const SUPABASE_URL = "https://pbrspseyfwamcvcilrnk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GltBtyhYDbNTzbeNWkM_6w_JtByaAu8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const C = {
  plum: "#4B2E5A", coral: "#FF6B5C", mint: "#22A879", amber: "#E8963A",
  ink: "#2B2033", inkSoft: "#7A6E86", line: "#E4D9F5",
  coralSoft: "#FFE4E0", mintSoft: "#DFF4EC", amberSoft: "#FBE9D3",
};
const fmt = (n) => "£" + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => crypto.randomUUID();

// ---------------- shared small components ----------------
function Card({ children, tint, style }) {
  return <div className="rounded-3xl p-5 bg-white shadow-sm" style={{ background: tint || "white", border: `1px solid ${C.line}`, ...style }}>{children}</div>;
}
function Eyebrow({ children }) {
  return <div className="font-display text-sm font-bold uppercase tracking-wide" style={{ color: C.plum }}>{children}</div>;
}
function PillButton({ onClick, children, primary, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className="px-4 py-2 rounded-full font-semibold text-sm"
      style={{
        background: disabled ? "#ccc" : primary ? C.plum : "white",
        color: primary || disabled ? "white" : C.plum,
        border: `1px solid ${primary ? C.plum : C.line}`,
        cursor: disabled ? "not-allowed" : "pointer",
      }}>
      {children}
    </button>
  );
}
function NumField({ value, onChange, width }) {
  const [local, setLocal] = useState(value);
  useEffect(() => setLocal(value), [value]);
  return (
    <input type="number" value={local} style={{ width: width || 90 }}
      className="rounded-lg px-2 py-1 border text-right"
      onChange={(e) => setLocal(e.target.value)}
      onBlur={() => onChange(parseFloat(local) || 0)} />
  );
}
function TextField({ value, onChange, width }) {
  const [local, setLocal] = useState(value);
  useEffect(() => setLocal(value), [value]);
  return (
    <input type="text" value={local} style={{ width: width || 140 }}
      className="rounded-lg px-2 py-1 border"
      onChange={(e) => setLocal(e.target.value)}
      onBlur={() => onChange(local)} />
  );
}
function Row({ label, value, bold, big, color }) {
  return (
    <div className="flex justify-between items-center">
      <span style={{ color: C.inkSoft, fontWeight: bold ? 700 : 500, fontSize: big ? 16 : 14 }}>{label}</span>
      <span style={{ color: color || C.ink, fontWeight: bold ? 800 : 600, fontSize: big ? 20 : 14 }}>{value}</span>
    </div>
  );
}

// ---------------- Auth ----------------
function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg("");
    if (mode === "signup") {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) setMsg(error.message);
      else setMsg("Check your email to confirm your account, then log in.");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) setMsg(error.message);
      else onAuthed();
    }
    setBusy(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="w-full max-w-sm">
        <h1 className="font-display text-3xl font-extrabold mb-1" style={{ color: C.plum }}>No Bullshit Budgeting</h1>
        <p className="mb-6" style={{ color: C.inkSoft }}>Zero-based budgeting, no fluff.</p>
        <Card>
          <div className="space-y-3">
            <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)}
              className="w-full rounded-lg px-3 py-2 border" />
            <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)}
              className="w-full rounded-lg px-3 py-2 border" />
            {msg && <p style={{ color: C.coral, fontSize: 13 }}>{msg}</p>}
            <PillButton onClick={submit} primary disabled={busy}>
              {mode === "signup" ? "Create account" : "Log in"}
            </PillButton>
            <button className="text-sm underline block" style={{ color: C.inkSoft }}
              onClick={() => { setMode(mode === "signup" ? "login" : "signup"); setMsg(""); }}>
              {mode === "signup" ? "Already have an account? Log in" : "New here? Create an account"}
            </button>
          </div>
        </Card>
      </div>
    </div>
  );
}

// ---------------- Main App ----------------
const TABS = ["Payday", "Bills", "Pots", "Safety Net", "Debt", "Future You", "History", "Get Set Up"];

function App({ userId, onLogout }) {
  const [tab, setTab] = useState("Payday");
  const [loading, setLoading] = useState(true);
  const [settings, setSettings] = useState(null);
  const [bills, setBills] = useState([]);
  const [debts, setDebts] = useState([]);
  const [pots, setPots] = useState([]);
  const [history, setHistory] = useState([]);
  const [alloc, setAlloc] = useState({ safetyNet: 0, debt: 0, investing: 0 });
  const [adjustment, setAdjustment] = useState(0);

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    let { data: s } = await sb.from("settings").select("*").eq("user_id", userId).maybeSingle();
    if (!s) {
      const { data: created } = await sb.from("settings").insert({ user_id: userId }).select().maybeSingle();
      s = created;
    }
    setSettings(s);
    const { data: b } = await sb.from("bills").select("*").eq("user_id", userId).order("due");
    const { data: d } = await sb.from("debts").select("*").eq("user_id", userId);
    const { data: p } = await sb.from("pots").select("*").eq("user_id", userId);
    const { data: h } = await sb.from("payday_history").select("*").eq("user_id", userId).order("date");
    setBills(b || []); setDebts(d || []); setPots(p || []); setHistory(h || []);
    setLoading(false);
  }

  async function saveSettings(patch) {
    setSettings((s) => ({ ...s, ...patch }));
    await sb.from("settings").update(patch).eq("user_id", userId);
  }
  async function addBill() {
    const { data } = await sb.from("bills").insert({ user_id: userId, name: "New bill", amount: 0, due: 1, paid: false, category: "" }).select().maybeSingle();
    setBills((b) => [...b, data]);
  }
  async function updateBill(id, patch) {
    setBills((b) => b.map((x) => (x.id === id ? { ...x, ...patch } : x)));
    await sb.from("bills").update(patch).eq("id", id);
  }
  async function deleteBill(id) {
    setBills((b) => b.filter((x) => x.id !== id));
    await sb.from("bills").delete().eq("id", id);
  }
  async function addDebt() {
    const { data } = await sb.from("debts").insert({ user_id: userId, name: "New debt", balance: 0, rate: 0, min_payment: 0 }).select().maybeSingle();
    setDebts((d) => [...d, data]);
  }
  async function updateDebt(id, patch) {
    setDebts((d) => d.map((x) => (x.id === id ? { ...x, ...patch } : x)));
    await sb.from("debts").update(patch).eq("id", id);
  }
  async function deleteDebt(id) {
    setDebts((d) => d.filter((x) => x.id !== id));
    await sb.from("debts").delete().eq("id", id);
  }
  async function addPot() {
    const { data } = await sb.from("pots").insert({ user_id: userId, name: "New pot", target: 0, months: 1, saved: 0, active: true }).select().maybeSingle();
    setPots((p) => [...p, data]);
  }
  async function updatePot(id, patch) {
    setPots((p) => p.map((x) => (x.id === id ? { ...x, ...patch } : x)));
    await sb.from("pots").update(patch).eq("id", id);
  }
  async function deletePot(id) {
    setPots((p) => p.filter((x) => x.id !== id));
    await sb.from("pots").delete().eq("id", id);
  }

  if (loading || !settings) return <div className="p-8 text-center" style={{ color: C.inkSoft }}>Loading…</div>;

  // ---------- derived calcs ----------
  const billsTotal = bills.reduce((s, b) => s + Number(b.amount), 0);
  const unpaidTotal = bills.filter((b) => !b.paid).reduce((s, b) => s + Number(b.amount), 0);
  const paidTotal = billsTotal - unpaidTotal;
  const activePots = pots.filter((p) => p.active);
  const potsMonthlyTotal = activePots.reduce((s, p) => s + (p.months > 0 ? p.target / p.months : 0), 0);
  const debtMinPaymentsTotal = debts.reduce((s, d) => s + Math.min(Number(d.min_payment), Number(d.balance)), 0);
  const netAfterBills = settings.wage - billsTotal - debtMinPaymentsTotal;
  const netAfterSpending = netAfterBills - settings.spending_goal;
  const netForWaterfall = netAfterSpending - potsMonthlyTotal + adjustment;
  const totalDebtBalance = debts.reduce((s, d) => s + Number(d.balance), 0);
  const snowballDebts = [...debts].sort((a, b) => a.balance - b.balance);
  const emergencyLow = settings.monthly_essentials * 3;
  const emergencyHigh = settings.monthly_essentials * 6;

  let remaining = Math.max(0, netForWaterfall);
  const suggested = { safetyNet: 0, debt: 0, debtBreakdown: [], investing: 0 };
  const bufferNeed = Math.max(0, 1500 - settings.safety_net_saved);
  const toBuffer = Math.min(remaining, bufferNeed);
  suggested.safetyNet += toBuffer; remaining -= toBuffer;
  const bufferMet = settings.safety_net_saved + toBuffer >= 1500;
  if (bufferMet) {
    for (const d of snowballDebts) {
      if (remaining <= 0) break;
      const take = Math.min(remaining, d.balance);
      if (take > 0) suggested.debtBreakdown.push({ name: d.name, amount: take });
      suggested.debt += take; remaining -= take;
    }
  }
  const debtCleared = totalDebtBalance - suggested.debt <= 0.01;
  if (bufferMet && debtCleared) {
    const emergencyNeed = Math.max(0, emergencyLow - (settings.safety_net_saved + toBuffer));
    const toEmergency = Math.min(remaining, emergencyNeed);
    suggested.safetyNet += toEmergency; remaining -= toEmergency;
  }
  if (bufferMet && debtCleared && settings.safety_net_saved + suggested.safetyNet >= emergencyLow) {
    suggested.investing = remaining;
  }
  let stage;
  if (settings.safety_net_saved < 1500) stage = "Building your £1,500 starter buffer";
  else if (totalDebtBalance > 0) stage = "Snowballing your debt";
  else if (settings.safety_net_saved < emergencyLow) stage = "Building your full emergency fund";
  else stage = "Investing for the future";

  const unallocated = netForWaterfall - (alloc.safetyNet + alloc.debt + alloc.investing);
  const isZero = Math.abs(unallocated) < 0.01;
  const short = netForWaterfall < 0;

  const useSuggested = () => setAlloc({
    safetyNet: Math.round(suggested.safetyNet * 100) / 100,
    debt: Math.round(suggested.debt * 100) / 100,
    investing: Math.round(suggested.investing * 100) / 100,
  });

  async function confirmPayday() {
    // 1. minimum payments off every debt
    const afterMins = debts.map((d) => ({ ...d, balance: Math.round((d.balance - Math.min(d.min_payment, d.balance)) * 100) / 100 }));
    // 2. extra snowball allocation on top
    let debtRemaining = alloc.debt;
    const sorted = [...afterMins].sort((a, b) => a.balance - b.balance);
    const updated = afterMins.map((d) => ({ ...d }));
    for (const sd of sorted) {
      if (debtRemaining <= 0) break;
      const t = updated.find((d) => d.id === sd.id);
      const take = Math.min(debtRemaining, t.balance);
      t.balance = Math.round((t.balance - take) * 100) / 100;
      debtRemaining -= take;
    }
    for (const d of updated) await sb.from("debts").update({ balance: d.balance }).eq("id", d.id);
    setDebts(updated);

    const newSafetyNet = Math.round((settings.safety_net_saved + alloc.safetyNet) * 100) / 100;
    const newGoalCurrent = Math.round((settings.goal_current + alloc.investing) * 100) / 100;
    await saveSettings({ safety_net_saved: newSafetyNet, goal_current: newGoalCurrent });

    for (const b of bills) await sb.from("bills").update({ paid: false }).eq("id", b.id);
    setBills((b) => b.map((x) => ({ ...x, paid: false })));

    const newTotalDebt = Math.round(updated.reduce((s, d) => s + d.balance, 0) * 100) / 100;
    const snap = { user_id: userId, date: new Date().toISOString().slice(0, 10), safety_net: newSafetyNet, debt: newTotalDebt, investing: newGoalCurrent };
    const { data: h } = await sb.from("payday_history").insert(snap).select().maybeSingle();
    setHistory((old) => [...old, h]);

    setAlloc({ safetyNet: 0, debt: 0, investing: 0 });
    setAdjustment(0);
  }

  return (
    <div className="min-h-screen pb-24">
      <div className="p-4 flex justify-between items-center">
        <h1 className="font-display text-xl font-extrabold" style={{ color: C.plum }}>No Bullshit Budgeting</h1>
        <button onClick={onLogout} className="text-sm underline" style={{ color: C.inkSoft }}>Log out</button>
      </div>
      <div className="px-4 flex gap-2 flex-wrap mb-4">
        {TABS.map((t) => (
          <button key={t} onClick={() => setTab(t)}
            className="px-3 py-1.5 rounded-full text-sm font-semibold"
            style={{ background: tab === t ? C.plum : "white", color: tab === t ? "white" : C.plum, border: `1px solid ${C.line}` }}>
            {t}
          </button>
        ))}
      </div>

      <div className="px-4 space-y-6 max-w-2xl mx-auto">
        {tab === "Payday" && (
          <>
            <Eyebrow>Payday</Eyebrow>
            <Card>
              <div className="flex flex-wrap gap-6">
                <div><div className="text-xs mb-1" style={{ color: C.inkSoft }}>Wage</div><NumField value={settings.wage} onChange={(v) => saveSettings({ wage: v })} /></div>
                <div><div className="text-xs mb-1" style={{ color: C.inkSoft }}>Payday (day)</div><NumField value={settings.payday_day} onChange={(v) => saveSettings({ payday_day: v })} width={60} /></div>
                <div><div className="text-xs mb-1" style={{ color: C.inkSoft }}>Spending goal</div><NumField value={settings.spending_goal} onChange={(v) => saveSettings({ spending_goal: v })} /></div>
              </div>
            </Card>
            <Card>
              <div className="space-y-2">
                <Row label="Wage" value={fmt(settings.wage)} />
                <Row label="Bills" value={"− " + fmt(billsTotal)} color={C.coral} />
                {debtMinPaymentsTotal > 0 && <Row label="Debt minimum payments" value={"− " + fmt(debtMinPaymentsTotal)} color={C.coral} />}
                <Row label="Guilt-free spending" value={"− " + fmt(settings.spending_goal)} color={C.coral} />
                {potsMonthlyTotal > 0 && <Row label="Sinking pots" value={"− " + fmt(potsMonthlyTotal)} color={C.coral} />}
                <div className="flex justify-between items-center gap-3 py-1">
                  <span className="text-sm" style={{ color: C.inkSoft }}>Anything unexpected? (+ bonus, − cost)</span>
                  <NumField value={adjustment} onChange={setAdjustment} />
                </div>
                <div style={{ borderTop: `1px dashed ${C.line}` }} className="my-2" />
                <Row label="Left to give a job" value={fmt(netForWaterfall)} bold big color={short ? C.coral : C.plum} />
              </div>
            </Card>
            {short ? (
              <Card tint={C.coralSoft}><p style={{ color: "#B33A2C", fontSize: 13 }}>You're short this payday — bills, spending, and pots add up to more than the wage.</p></Card>
            ) : (
              <>
                <Eyebrow>You decide — right now: {stage}</Eyebrow>
                <Card>
                  <div className="space-y-3">
                    {[
                      ["safetyNet", "Safety net (buffer, then 3–6 months)", suggested.safetyNet],
                      ["debt", "Debt snowball" + (suggested.debtBreakdown.length ? " — " + suggested.debtBreakdown.map((d) => d.name).join(", ") : ""), suggested.debt],
                      ["investing", "Investing", suggested.investing],
                    ].map(([key, label, sug]) => (
                      <div key={key} className="flex justify-between items-center gap-3 rounded-xl px-4 py-2.5" style={{ background: "#F7F3FD" }}>
                        <div>
                          <div className="text-sm font-semibold">{label}</div>
                          <div className="text-xs" style={{ color: C.inkSoft }}>recommended: {fmt(sug)}</div>
                        </div>
                        <NumField value={alloc[key]} onChange={(v) => setAlloc((a) => ({ ...a, [key]: v }))} />
                      </div>
                    ))}
                  </div>
                  <div className="flex justify-between items-center flex-wrap gap-3 mt-4 pt-4" style={{ borderTop: `1px solid ${C.line}` }}>
                    <PillButton onClick={useSuggested}>Use recommended split</PillButton>
                    <div className="text-right">
                      <div className="text-xs font-semibold" style={{ color: C.inkSoft }}>{isZero ? "Every pound's got a job" : "Still unallocated"}</div>
                      <div className="font-display text-2xl font-bold" style={{ color: isZero ? C.mint : C.coral }}>{fmt(unallocated)}</div>
                    </div>
                  </div>
                </Card>
                <Card tint={isZero ? C.mintSoft : "#FAFAFA"}>
                  <div className="flex justify-between items-center flex-wrap gap-3">
                    <p className="text-xs max-w-xs" style={{ color: C.inkSoft }}>Confirming pays debt minimums + your extra allocation, tops up safety net & investing, and resets bills for the new month.</p>
                    <PillButton onClick={confirmPayday} primary={isZero} disabled={!isZero}>Confirm payday</PillButton>
                  </div>
                </Card>
              </>
            )}
          </>
        )}

        {tab === "Bills" && (
          <>
            <Eyebrow>Bills — {fmt(unpaidTotal)} left of {fmt(billsTotal)}</Eyebrow>
            {bills.map((b) => (
              <Card key={b.id}>
                <div className="flex items-center gap-3 flex-wrap">
                  <input type="checkbox" checked={b.paid} onChange={(e) => updateBill(b.id, { paid: e.target.checked })} />
                  <TextField value={b.name} onChange={(v) => updateBill(b.id, { name: v })} />
                  <NumField value={b.amount} onChange={(v) => updateBill(b.id, { amount: v })} />
                  <span className="text-xs" style={{ color: C.inkSoft }}>due day</span>
                  <NumField value={b.due} onChange={(v) => updateBill(b.id, { due: v })} width={50} />
                  <button onClick={() => deleteBill(b.id)} className="text-xs" style={{ color: C.coral }}>remove</button>
                </div>
              </Card>
            ))}
            <PillButton onClick={addBill} primary>+ Add bill</PillButton>
          </>
        )}

        {tab === "Pots" && (
          <>
            <Eyebrow>Sinking Pots — {fmt(potsMonthlyTotal)}/month (active)</Eyebrow>
            {pots.map((p) => (
              <Card key={p.id}>
                <div className="flex items-center gap-3 flex-wrap">
                  <input type="checkbox" checked={p.active} onChange={(e) => updatePot(p.id, { active: e.target.checked })} />
                  <TextField value={p.name} onChange={(v) => updatePot(p.id, { name: v })} />
                  <span className="text-xs" style={{ color: C.inkSoft }}>target</span>
                  <NumField value={p.target} onChange={(v) => updatePot(p.id, { target: v })} />
                  <span className="text-xs" style={{ color: C.inkSoft }}>months</span>
                  <NumField value={p.months} onChange={(v) => updatePot(p.id, { months: v })} width={60} />
                  <span className="text-xs" style={{ color: C.inkSoft }}>saved</span>
                  <NumField value={p.saved} onChange={(v) => updatePot(p.id, { saved: v })} />
                  <button onClick={() => deletePot(p.id)} className="text-xs" style={{ color: C.coral }}>remove</button>
                </div>
              </Card>
            ))}
            <PillButton onClick={addPot} primary>+ Add pot</PillButton>
          </>
        )}

        {tab === "Safety Net" && (
          <>
            <Eyebrow>Safety Net</Eyebrow>
            <Card>
              <div className="mb-3"><span className="text-xs" style={{ color: C.inkSoft }}>Saved so far</span><div><NumField value={settings.safety_net_saved} onChange={(v) => saveSettings({ safety_net_saved: v })} width={120} /></div></div>
              <div className="mb-3"><span className="text-xs" style={{ color: C.inkSoft }}>Monthly essentials (for 3–6 month target)</span><div><NumField value={settings.monthly_essentials} onChange={(v) => saveSettings({ monthly_essentials: v })} width={120} /></div></div>
              <Row label="Starter buffer target" value={fmt(1500)} />
              <Row label="Full emergency fund (3–6 months)" value={fmt(emergencyLow) + " – " + fmt(emergencyHigh)} />
            </Card>
          </>
        )}

        {tab === "Debt" && (
          <>
            <Eyebrow>Debt — total {fmt(totalDebtBalance)}</Eyebrow>
            {debts.map((d) => (
              <Card key={d.id}>
                <div className="flex items-center gap-3 flex-wrap">
                  <TextField value={d.name} onChange={(v) => updateDebt(d.id, { name: v })} />
                  <span className="text-xs" style={{ color: C.inkSoft }}>balance</span>
                  <NumField value={d.balance} onChange={(v) => updateDebt(d.id, { balance: v })} />
                  <span className="text-xs" style={{ color: C.inkSoft }}>rate %</span>
                  <NumField value={d.rate} onChange={(v) => updateDebt(d.id, { rate: v })} width={60} />
                  <span className="text-xs" style={{ color: C.inkSoft }}>min payment</span>
                  <NumField value={d.min_payment} onChange={(v) => updateDebt(d.id, { min_payment: v })} />
                  <button onClick={() => deleteDebt(d.id)} className="text-xs" style={{ color: C.coral }}>remove</button>
                </div>
              </Card>
            ))}
            <PillButton onClick={addDebt} primary>+ Add debt</PillButton>
          </>
        )}

        {tab === "Future You" && (
          <>
            <Eyebrow>Future You</Eyebrow>
            <Card>
              <div className="space-y-3">
                <div><span className="text-xs" style={{ color: C.inkSoft }}>Goal name</span><div><TextField value={settings.goal_name} onChange={(v) => saveSettings({ goal_name: v })} width={220} /></div></div>
                <div><span className="text-xs" style={{ color: C.inkSoft }}>Target</span><div><NumField value={settings.goal_target} onChange={(v) => saveSettings({ goal_target: v })} width={120} /></div></div>
                <div><span className="text-xs" style={{ color: C.inkSoft }}>Current</span><div><NumField value={settings.goal_current} onChange={(v) => saveSettings({ goal_current: v })} width={120} /></div></div>
                <div><span className="text-xs" style={{ color: C.inkSoft }}>Months to get there</span><div><NumField value={settings.goal_months} onChange={(v) => saveSettings({ goal_months: v })} width={80} /></div></div>
                <Row label="Remaining" value={fmt(settings.goal_target - settings.goal_current)} />
                <Row label="Needed per month" value={fmt(settings.goal_months > 0 ? (settings.goal_target - settings.goal_current) / settings.goal_months : 0)} />
              </div>
            </Card>
            <Card>
              <p className="text-xs mb-2" style={{ color: C.inkSoft }}>UK ISA allowance: £20,000/year. Reference: "How to Own the World" by Andrew Craig — plain-English case for low-cost, globally diversified investing.</p>
              <textarea className="w-full rounded-lg border p-2 text-sm" rows="4" value={settings.goal_notes || ""}
                onChange={(e) => setSettings((s) => ({ ...s, goal_notes: e.target.value }))}
                onBlur={(e) => saveSettings({ goal_notes: e.target.value })} placeholder="Your own strategy notes..." />
            </Card>
          </>
        )}

        {tab === "History" && (
          <>
            <Eyebrow>History — one point per confirmed payday</Eyebrow>
            {history.length === 0 ? (
              <Card><p className="text-sm" style={{ color: C.inkSoft }}>Nothing logged yet — confirm your first payday and it'll show up here.</p></Card>
            ) : (
              <>
                <Card>
                  <MiniChart history={history} />
                </Card>
                <Card>
                  <div className="space-y-1.5 text-sm">
                    {[...history].reverse().map((h, i) => (
                      <div key={i} className="flex justify-between py-1" style={{ borderBottom: i < history.length - 1 ? `1px solid ${C.line}` : "none" }}>
                        <span className="text-xs font-semibold" style={{ color: C.inkSoft }}>{h.date}</span>
                        <span className="text-xs" style={{ color: C.mint }}>SN {fmt(h.safety_net)}</span>
                        <span className="text-xs" style={{ color: C.coral }}>Debt {fmt(h.debt)}</span>
                        <span className="text-xs" style={{ color: C.plum }}>Inv {fmt(h.investing)}</span>
                      </div>
                    ))}
                  </div>
                </Card>
              </>
            )}
          </>
        )}

        {tab === "Get Set Up" && (
          <>
            <Eyebrow>Get Set Up</Eyebrow>
            <Card>
              <div className="font-display text-lg font-bold mb-2" style={{ color: C.plum }}>Recommended: Monzo</div>
              <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Move your free cash into Monzo, then split it into real Pots that match the ones here — buffer, emergency fund, Christmas, MOT, the lot.</p>
              <div className="rounded-xl px-4 py-3 text-sm" style={{ background: "#F7F3FD", border: `1px solid ${C.line}` }}>
                <a href="https://join.monzo.com/c/jnwlwg98" target="_blank" style={{ color: C.plum, fontWeight: 700 }}>join.monzo.com/c/jnwlwg98</a>
                <p className="text-xs mt-1" style={{ color: C.inkSoft }}>This is a referral link — using it may earn a reward if the recipient signs up.</p>
              </div>
            </Card>
          </>
        )}
      </div>
    </div>
  );
}

function MiniChart({ history }) {
  const w = 320, h = 160, pad = 10;
  const all = history.flatMap((hh) => [hh.safety_net, hh.debt, hh.investing]);
  const max = Math.max(1, ...all);
  const line = (key, color) => {
    const points = history.map((hh, i) => {
      const x = pad + (i / Math.max(1, history.length - 1)) * (w - pad * 2);
      const y = (h - pad) - (hh[key] / max) * (h - pad * 2);
      return `${x},${y}`;
    }).join(" ");
    return <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" />;
  };
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`}>
      {line("safety_net", C.mint)}
      {line("debt", C.coral)}
      {line("investing", C.plum)}
    </svg>
  );
}

// ---------------- Root ----------------
function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div className="p-8 text-center" style={{ color: C.inkSoft }}>Loading…</div>;
  if (!session) return <AuthScreen onAuthed={() => {}} />;
  return <App userId={session.user.id} onLogout={() => sb.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
